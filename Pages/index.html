<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · College Uniform Portal</title>
<link rel="stylesheet" href="../CSS/index.css">
<link rel="stylesheet" href="../CSS/base.css">
<link rel="stylesheet" href="../CSS/Components.css">
</head>
<body>

<div class="login-card">
    <div class="login-brand">
        <div class="brand-badge">U</div>
        <h1 style="color:#5f2525; margin-bottom:0;">Uniform Portal</h1>
        <p style="color:rgba(54, 18, 18, 0.85); font-size:0.85rem;">College Uniform Management System</p>
    </div>
    

    <div class="card">
        <h2>Log in</h2>
        <div id="errorBox" class="form-error hidden"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="username" placeholder="you@college.test">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log in</button>
        </form>

        <!-- <div class="demo-accounts"> -->
            <!-- <strong>Dev test accounts</strong><br>
            Student: <code>student@college.test</code> / <code>Student@123</code><br>
            Staff: <code>staff@college.test</code> / <code>Staff@123</code><br>
            Admin: <code>admin@college.test</code> / <code>Admin@123</code> -->
        </div>
    </div>
</div>
</body>
</html>
